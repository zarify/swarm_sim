<!doctype html>
<html lang="en" data-framework="typescript">
  <head>
    <meta charset="utf-8" />
    <title>Patched BBC micro:bit simulator</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
    <script src="https://cdn.makecode.com/blob/5d475bb1e350ee095419e8757b8e3cd6a09b1291/pxtsim.js"></script>
    <script src="https://cdn.makecode.com/blob/9d07f74640d92282a192245b78ab9f27865735de/sim.js"></script>
  </head>
  <body>
    <script>
      (() => {
        const SIM_INIT_FLAG = '__swarmMakeCodePatchedSimulatorInitialized__';
        if (window[SIM_INIT_FLAG]) {
          return;
        }
        window[SIM_INIT_FLAG] = true;

        const RUNNER_ORIGIN = window.location.origin;
        const pendingMessages = [];
        let simulatorReady = false;
        let lastDisplay = '';
        let lastSound = -1;
        let lastRadioConfigKey = 'none';
        const SOUND_OUTPUT_PULSE_MS = 240;
        const SOUND_TRACE_MIN_INTERVAL_MS = 400;
        const SOUND_PLAY_METHODS = [
          'play',
          'playTone',
          'playInstructions',
          'playInstructionsAsync',
          'queuePlayInstructions',
          'playSound',
          'playSoundEffect',
          'playMelody',
          'startPlaying',
          'speak',
        ];
        const SOUND_MUTE_METHODS = [
          'setVolume',
          'setOutputLevel',
          'setLevel',
        ];
        const TRACE_RADIO = window.location.hostname === 'localhost';
        const TRACE_SOUND = window.location.hostname === 'localhost';
        const desiredSensors = {
          lightLevel: 0,
          soundLevel: 0,
        };
        const patchedRadioStates = new WeakSet();
        const patchedSoundStates = new WeakSet();
        const observedRadioConfig = {
          group: undefined,
          channel: undefined,
        };
        const AB_PULSE_DEDUP_WINDOW_MS = 50;
        let lastABPulseAtMs = -Infinity;
        let globalAudioStartHooksPatched = false;
        let lastGlobalAudioTraceAtMs = 0;
        let soundOutputPulseUntilMs = 0;
        let lastSoundOutputLevel = 0;

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent || event.origin !== RUNNER_ORIGIN) {
            return;
          }
          const data = event.data;
          if (!isRecord(data) || typeof data.type !== 'string') {
            return;
          }
          if (!data.type.startsWith('swarm-')) {
            return;
          }
          if (data.type === 'swarm-radiopacket') {
            traceRadio('enqueue-radio-input', {
              sequence: Number.isFinite(Number(data.swarmSeq)) ? Number(data.swarmSeq) : undefined,
              rssi: Number.isFinite(Number(data.rssi)) ? Number(data.rssi) : undefined,
            });
          }
          pendingMessages.push(data);
          flushPendingMessages();
        });

        const tick = () => {
          const board = getBoard();
          if (board && !simulatorReady) {
            simulatorReady = true;
            postToRunner({ type: 'swarm-simulator-ready' });
          }
          patchGlobalAudioStartHooks();
          patchRadioStateHooks(board);
          patchSoundStateHooks(board);
          flushPendingMessages();
          applyDesiredSensors(board);
          publishState(board);
          window.setTimeout(tick, 40);
        };
        tick();

        function flushPendingMessages() {
          const board = getBoard();
          if (!board || pendingMessages.length === 0) {
            return;
          }

          for (const message of pendingMessages.splice(0, pendingMessages.length)) {
            try {
              if (message.type === 'swarm-set-sensor') {
                updateDesiredSensor(message);
              } else if (message.type === 'swarm-set-button') {
                applyButton(board, message);
              } else if (message.type === 'swarm-pulse-button-ab') {
                if (isDuplicateABPulse()) {
                  continue;
                }
                applyButtonAB(board);
              } else if (message.type === 'swarm-radiopacket') {
                applyRadioPacket(board, message);
              }
            } catch (error) {
              postToRunner({
                type: 'swarm-runtime-event',
                eventType: 'internal-error',
                payload: { message: toErrorMessage(error) },
              });
            }
          }
          applyDesiredSensors(board);
        }

        function updateDesiredSensor(message) {
          const sensor = message.sensor;
          const value = clampByte(Number(message.value));
          if (sensor === 'lightLevel') {
            desiredSensors.lightLevel = value;
          } else if (sensor === 'soundLevel') {
            desiredSensors.soundLevel = value;
          }
        }

        function applyDesiredSensors(board) {
          if (!board) {
            return;
          }
          let changed = false;
          if (board.lightSensorState) {
            const currentLight = clampByte(Number(board.lightSensorState.lightLevel ?? 0));
            if (!board.lightSensorState.usesLightLevel || currentLight !== desiredSensors.lightLevel) {
              board.lightSensorState.usesLightLevel = true;
              board.lightSensorState.lightLevel = desiredSensors.lightLevel;
              changed = true;
            }
          }
          if (board.microphoneState) {
            const currentSound = clampByte(Number(board.microphoneState.getLevel?.() ?? 0));
            if (currentSound !== desiredSensors.soundLevel) {
              board.microphoneState.setUsed?.();
              board.microphoneState.setLevel?.(desiredSensors.soundLevel);
              changed = true;
            }
          }
          if (changed) {
            queueDisplayUpdate();
          }
        }

        function applyButton(board, message) {
          const pair = board.buttonPairState;
          if (!pair || !board.bus) {
            return;
          }
          const button = message.button === 'B' ? pair.bBtn : pair.aBtn;
          const pressed = Boolean(message.pressed);
          if (pressed === Boolean(button.pressed)) {
            return;
          }

          button.pressed = pressed;
          board.bus.queue(button.id, pressed ? 1 : 2);
          if (!pressed) {
            board.bus.queue(button.id, 3);
          }

          const bothPressed = Boolean(pair.aBtn.pressed && pair.bBtn.pressed);
          if (bothPressed !== Boolean(pair.abBtn.pressed)) {
            pair.abBtn.pressed = bothPressed;
            board.bus.queue(pair.abBtn.id, bothPressed ? 1 : 2);
            if (!bothPressed) {
              board.bus.queue(pair.abBtn.id, 3);
            }
          }
          queueDisplayUpdate();
        }

        function applyButtonAB(board) {
          const pair = board.buttonPairState;
          if (!pair || !board.bus) {
            return;
          }
          pair.abBtn.pressed = true;
          board.bus.queue(pair.abBtn.id, 1);
          pair.abBtn.pressed = false;
          board.bus.queue(pair.abBtn.id, 2);
          board.bus.queue(pair.abBtn.id, 3);
          queueDisplayUpdate();
        }

        function isDuplicateABPulse() {
          const now = performance.now();
          if (now - lastABPulseAtMs < AB_PULSE_DEDUP_WINDOW_MS) {
            return true;
          }
          lastABPulseAtMs = now;
          return false;
        }

        function applyRadioPacket(board, message) {
          const radioState = board.radioState;
          if (!radioState || typeof radioState.receivePacket !== 'function') {
            return;
          }
          const sequence = Number.isFinite(Number(message.swarmSeq)) ? Number(message.swarmSeq) : undefined;
          const payload = isRecord(message.payload) ? message.payload : {};
          const packet = {
            type: 'radiopacket',
            rssi: Number.isFinite(Number(message.rssi)) ? Number(message.rssi) : -75,
            serial: Number.isFinite(Number(message.serial)) ? Number(message.serial) : 0,
            time: Number.isFinite(Number(message.time)) ? Number(message.time) : Date.now(),
            payload: {
              type: 0,
              groupId: Number.isFinite(Number(payload.groupId)) ? Number(payload.groupId) : 0,
              bufferData: normalizeBufferData(payload.bufferData),
            },
          };
          traceRadio('apply-radio-input', {
            sequence,
            rssi: packet.rssi,
            groupId: packet.payload.groupId,
            bytes: packet.payload.bufferData.length,
            preview: [...packet.payload.bufferData.slice(0, 8)],
          });
          radioState.receivePacket(packet);
        }

        function publishState(board) {
          if (!board) {
            return;
          }
          const displayPixels = readDisplayPixels(board);
          const soundLevel = readSoundLevel(board);
          const radio = readRadioConfig(board);
          const displayKey = displayPixels.join(',');
          const radioConfigKey = `${radio.group ?? 'none'}:${radio.channel ?? 'none'}`;
          if (displayKey === lastDisplay && soundLevel === lastSound && radioConfigKey === lastRadioConfigKey) {
            return;
          }
          lastDisplay = displayKey;
          lastSound = soundLevel;
          lastRadioConfigKey = radioConfigKey;
          postToRunner({
            type: 'swarm-simulator-state',
            displayPixels,
            soundLevel,
            ...(radio.group === undefined && radio.channel === undefined ? {} : { radio }),
          });
        }

        function patchRadioStateHooks(board) {
          if (!board || !isRecord(board.radioState)) {
            return;
          }
          const radioState = board.radioState;
          if (patchedRadioStates.has(radioState)) {
            return;
          }
          patchedRadioStates.add(radioState);
          patchMethod(radioState, 'setGroup', (args) => {
            const group = toOptionalGroup(args[0]);
            if (group !== undefined) {
              observedRadioConfig.group = group;
            }
          });
          patchMethod(radioState, 'setFrequencyBand', (args) => {
            const channel = toOptionalChannel(args[0]);
            if (channel !== undefined) {
              observedRadioConfig.channel = channel;
            }
          });
          patchMethod(radioState, 'setBand', (args) => {
            const channel = toOptionalChannel(args[0]);
            if (channel !== undefined) {
              observedRadioConfig.channel = channel;
            }
          });
          patchMethod(radioState, 'setChannel', (args) => {
            const channel = toOptionalChannel(args[0]);
            if (channel !== undefined) {
              observedRadioConfig.channel = channel;
            }
          });
        }

        function patchMethod(target, name, onInvoke) {
          if (!isRecord(target) || typeof target[name] !== 'function') {
            return;
          }
          const original = target[name];
          target[name] = function patchedRadioMethod(...args) {
            const result = original.apply(this, args);
            onInvoke?.(args);
            publishState(getBoard());
            return result;
          };
        }

        function patchGlobalAudioStartHooks() {
          if (globalAudioStartHooksPatched) {
            return;
          }
          const patchStart = (prototype, methodName, sourceName) => {
            if (!prototype || typeof prototype[methodName] !== 'function') {
              return;
            }
            const original = prototype[methodName];
            if (original.__swarmSoundPatched) {
              return;
            }
            prototype[methodName] = function patchedAudioStart(...args) {
              const now = Date.now();
              markSoundOutput(255);
              if (now - lastGlobalAudioTraceAtMs >= SOUND_TRACE_MIN_INTERVAL_MS) {
                traceSound('global-audio-start', { source: sourceName });
                lastGlobalAudioTraceAtMs = now;
              }
              return original.apply(this, args);
            };
            prototype[methodName].__swarmSoundPatched = true;
          };
          patchStart(window.AudioBufferSourceNode?.prototype, 'start', 'AudioBufferSourceNode.start');
          patchStart(window.OscillatorNode?.prototype, 'start', 'OscillatorNode.start');
          patchStart(window.ConstantSourceNode?.prototype, 'start', 'ConstantSourceNode.start');
          globalAudioStartHooksPatched = true;
        }

        function patchSoundStateHooks(board) {
          if (!board || !isRecord(board)) {
            return;
          }
          for (const soundState of getCandidateSoundStates(board)) {
            if (!isRecord(soundState) || patchedSoundStates.has(soundState)) {
              continue;
            }
            patchedSoundStates.add(soundState);
            forceMuteSoundState(soundState);
            for (const methodName of SOUND_PLAY_METHODS) {
              patchMethod(soundState, methodName, (args) => {
                markSoundOutput(inferSoundLevelFromArgs(args));
                forceMuteSoundState(soundState);
              });
            }
            for (const methodName of SOUND_MUTE_METHODS) {
              patchMethod(soundState, methodName, () => {
                forceMuteSoundState(soundState);
              });
            }
          }
        }

        function readDisplayPixels(board) {
          const data = board.ledMatrixState?.image?.data;
          if (!data || typeof data.length !== 'number') {
            return Array.from({ length: 25 }, () => 0);
          }
          const pixels = [];
          for (let index = 0; index < 25; index += 1) {
            const raw = Number(data[index] ?? 0);
            pixels.push(clampDisplay(raw));
          }
          return pixels;
        }

        function readSoundLevel(board) {
          const activeLevel = readActiveSoundLevel(board);
          if (activeLevel > 0) {
            markSoundOutput(activeLevel);
          }
          if (Date.now() < soundOutputPulseUntilMs) {
            return lastSoundOutputLevel;
          }
          return 0;
        }

        function readRadioConfig(board) {
          if (!board) {
            return {};
          }
          return {
            ...(observedRadioConfig.group === undefined ? {} : { group: observedRadioConfig.group }),
            ...(observedRadioConfig.channel === undefined
              ? {}
              : { channel: observedRadioConfig.channel }),
          };
        }

        function normalizeBufferData(value) {
          if (value instanceof Uint8Array) {
            return value;
          }
          if (Array.isArray(value)) {
            return new Uint8Array(value.map((entry) => Number(entry) & 0xff));
          }
          if (typeof value === 'string') {
            return new TextEncoder().encode(value);
          }
          return new Uint8Array();
        }

        function getCandidateSoundStates(board) {
          const candidates = [];
          const seen = new WeakSet();

          const addCandidate = (value) => {
            if (!isRecord(value) || seen.has(value) || !looksLikeSoundState(value)) {
              return;
            }
            seen.add(value);
            candidates.push(value);
          };

          addCandidate(board.audioState);
          addCandidate(board.soundState);
          addCandidate(board.speakerState);
          addCandidate(board.buzzerState);
          for (const [key, value] of Object.entries(board)) {
            if (!isRecord(value)) {
              continue;
            }
            const normalizedKey = key.toLowerCase();
            if (
              normalizedKey.includes('audio') ||
              normalizedKey.includes('sound') ||
              normalizedKey.includes('speaker') ||
              normalizedKey.includes('buzzer') ||
              looksLikeSoundState(value)
            ) {
              addCandidate(value);
            }
            if (!normalizedKey.includes('state')) {
              continue;
            }
            for (const [nestedKey, nestedValue] of Object.entries(value)) {
              if (!isRecord(nestedValue)) {
                continue;
              }
              const normalizedNestedKey = nestedKey.toLowerCase();
              if (
                normalizedNestedKey.includes('audio') ||
                normalizedNestedKey.includes('sound') ||
                normalizedNestedKey.includes('speaker') ||
                normalizedNestedKey.includes('buzzer') ||
                looksLikeSoundState(nestedValue)
              ) {
                addCandidate(nestedValue);
              }
            }
          }

          return candidates;
        }

        function inferSoundLevelFromArgs(args) {
          for (const value of args ?? []) {
            const numeric = Number(value);
            if (Number.isFinite(numeric) && numeric > 0) {
              return clampByte(numeric);
            }
          }
          return 255;
        }

        function markSoundOutput(level) {
          const normalized = clampByte(Number(level));
          if (normalized <= 0) {
            return;
          }
          const now = Date.now();
          const pulseWasInactive = now >= soundOutputPulseUntilMs;
          const nextPulseUntilMs = Math.max(soundOutputPulseUntilMs, now + SOUND_OUTPUT_PULSE_MS);
          if (pulseWasInactive || normalized !== lastSoundOutputLevel) {
            traceSound('mark-sound-output', {
              level: normalized,
              previousLevel: lastSoundOutputLevel,
              pulseRemainingMs: Math.max(0, nextPulseUntilMs - now),
            });
          }
          lastSoundOutputLevel = normalized;
          soundOutputPulseUntilMs = nextPulseUntilMs;
        }

        function readActiveSoundLevel(board) {
          for (const soundState of getCandidateSoundStates(board)) {
            if (!isRecord(soundState)) {
              continue;
            }
            const isPlaying =
              soundState.isPlaying?.() === true ||
              soundState.playing === true ||
              soundState.active === true;
            if (!isPlaying) {
              forceMuteSoundState(soundState);
              continue;
            }
            const levelCandidates = [
              soundState.volume,
              soundState.outputLevel,
              soundState.level,
              soundState.currentVolume,
            ];
            for (const candidate of levelCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric) && numeric > 0) {
                forceMuteSoundState(soundState);
                return clampByte(numeric);
              }
            }
            forceMuteSoundState(soundState);
            return 255;
          }
          return 0;
        }

        function looksLikeSoundState(value) {
          if (!isRecord(value)) {
            return false;
          }
          const hasPlaybackMethod =
            SOUND_PLAY_METHODS.some((name) => typeof value[name] === 'function') ||
            typeof value.isPlaying === 'function';
          if (!hasPlaybackMethod) {
            return false;
          }
          const hasAudioLevelSurface =
            'volume' in value ||
            'outputLevel' in value ||
            'level' in value ||
            'currentVolume' in value ||
            'setVolume' in value ||
            'setOutputLevel' in value ||
            'setLevel' in value;
          return hasAudioLevelSurface || value.playing === true;
        }

        function forceMuteSoundState(soundState) {
          if (!isRecord(soundState)) {
            return;
          }
          if ('volume' in soundState) {
            soundState.volume = 0;
          }
          if ('outputLevel' in soundState) {
            soundState.outputLevel = 0;
          }
          if ('level' in soundState) {
            soundState.level = 0;
          }
          if ('currentVolume' in soundState) {
            soundState.currentVolume = 0;
          }
        }

        function queueDisplayUpdate() {
          try {
            window.pxsim?.runtime?.queueDisplayUpdate?.();
          } catch {
            // Ignore transient runtime teardown races between program reloads.
          }
        }

        function getBoard() {
          try {
            if (!window.pxsim || typeof window.pxsim.board !== 'function') {
              return undefined;
            }
            return window.pxsim.board();
          } catch {
            return undefined;
          }
        }

        function clampByte(value) {
          if (!Number.isFinite(value)) {
            return 0;
          }
          return Math.max(0, Math.min(255, Math.round(value)));
        }

        function clampDisplay(raw) {
          const numeric = Number(raw);
          if (!Number.isFinite(numeric)) {
            return 0;
          }
          const bounded = Math.max(0, Math.min(255, Math.round(numeric)));
          return Math.round((bounded / 255) * 9);
        }

        function toOptionalGroup(value) {
          const numeric = Number(value);
          if (!Number.isInteger(numeric) || numeric < 0 || numeric > 255) {
            return undefined;
          }
          return numeric;
        }

        function toOptionalChannel(value) {
          const numeric = Number(value);
          if (!Number.isInteger(numeric) || numeric < 0 || numeric > 83) {
            return undefined;
          }
          return numeric;
        }

        function postToRunner(message) {
          window.parent.postMessage(message, RUNNER_ORIGIN);
        }

        function toErrorMessage(error) {
          if (error instanceof Error) {
            return error.message;
          }
          return typeof error === 'string' ? error : 'Patched simulator error';
        }

        function isRecord(value) {
          return typeof value === 'object' && value !== null;
        }

        function traceRadio(event, details) {
          if (!TRACE_RADIO) {
            return;
          }
          console.debug('[swarm-radio-trace]', `sim:${event}`, details);
        }

        function traceSound(event, details) {
          if (!TRACE_SOUND) {
            return;
          }
          console.debug('[swarm-sound-trace]', `sim:${event}`, details);
        }
      })();
    </script>
  </body>
</html>
